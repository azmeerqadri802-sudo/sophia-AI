name: Build Sophia Backend EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install -g pkg
        cd backend
        npm install

    - name: Build EXE with pkg
      run: |
        pkg backend/server.js --targets node18-win-x64 --output dist/SophiaCRM.exe

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sophia-Backend-EXE
        path: dist/SophiaCRM.exe
